name: Release plugin

on:
  workflow_dispatch:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate release files
        run: npm run check
      - name: Read manifest version
        id: version
        run: echo "value=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
      - name: Ensure pushed tag matches manifest version
        if: github.ref_type == 'tag'
        run: test "${GITHUB_REF_NAME}" = "${{ steps.version.outputs.value }}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" main.js manifest.json styles.css --clobber
          else
            gh release create "$VERSION" main.js manifest.json styles.css \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --generate-notes
          fi